<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16697a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ocean Accounting">
  <title>Ocean Accounting App</title>

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Ocean Accounting App",
    "short_name": "海洋記帳",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#f0f7f9",
    "theme_color": "#16697a",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/3143/3143186.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://cdn-icons-png.flaticon.com/512/3143/3143186.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  }'>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              50: '#f0f7f9',
              100: '#e1eff3',
              200: '#b8dbe5',
              300: '#8ec7d7',
              500: '#489fb5',
              700: '#16697a',
              900: '#003049'
            },
            coral: {
              100: '#fde8e5',
              400: '#e07a5f'
            },
            sand: '#f4a261'
          }
        }
      }
    }
  </script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { background-color: #f7fafc; user-select: none; }
    input[type="date"] { color-scheme: light; }
  </style>
</head>
<body class="flex justify-center bg-slate-100 min-h-screen">

  <div id="app" class="w-full max-w-md bg-ocean-50 min-h-screen flex flex-col shadow-2xl relative overflow-hidden text-slate-700">
    
    <!-- 背景裝飾 -->
    <div class="absolute top-12 right-4 opacity-20 pointer-events-none">
      <i data-lucide="fish" class="w-16 h-16 text-ocean-700"></i>
    </div>
    <div class="absolute bottom-12 left-2 opacity-15 pointer-events-none">
      <i data-lucide="waves" class="w-24 h-24 text-ocean-500"></i>
    </div>

    <!-- 頂部頁首：主分頁選單 -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-ocean-100 px-4 py-3 shadow-sm rounded-b-2xl">
      <div class="flex justify-around items-center">
        <button 
          v-for="tab in mainTabs" 
          :key="tab.id"
          @click="currentMainTab = tab.id"
          :class="['flex flex-col items-center p-2 rounded-xl transition-all duration-200', 
                   currentMainTab === tab.id ? 'bg-ocean-500 text-white shadow-md scale-105' : 'text-slate-400 hover:text-ocean-500']"
        >
          <i :data-lucide="tab.icon" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1 font-medium">{{ tab.name }}</span>
        </button>
      </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col p-4 overflow-y-auto z-10 pb-16">
      
      <!-- 當前分頁標題與新增按鈕 -->
      <div class="flex justify-between items-center mb-3">
        <h1 class="text-lg font-bold text-ocean-900 flex items-center gap-2">
          <i :data-lucide="currentTabInfo.icon" class="w-5 h-5 text-ocean-500"></i>
          {{ currentTabInfo.name }}
        </h1>
        
        <div class="flex items-center gap-2">
          <!-- 備份/匯入 按鈕（每月總結頁顯示） -->
          <div v-if="currentMainTab === 'summary'" class="flex gap-1">
            <button @click="exportData" title="匯出備份檔" class="p-1.5 text-xs bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-full">
              <i data-lucide="download" class="w-4 h-4"></i>
            </button>
            <label title="匯入備份檔" class="p-1.5 text-xs bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-full cursor-pointer">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <input type="file" accept=".json" @change="importData" class="hidden" />
            </label>
          </div>

          <button 
            v-if="currentMainTab !== 'summary'"
            @click="createNewTripGroup"
            class="flex items-center gap-1 text-xs bg-ocean-500 hover:bg-ocean-700 text-white px-3 py-1.5 rounded-full shadow transition-all active:scale-95 font-medium"
          >
            <span>+ 新增{{ currentTabInfo.name }}</span>
          </button>
          <button 
            v-else
            @click="showAddMonthModal = true"
            class="flex items-center gap-1 text-xs bg-ocean-500 hover:bg-ocean-700 text-white px-3 py-1.5 rounded-full shadow transition-all active:scale-95 font-medium"
          >
            <span>+ 新增月份</span>
          </button>
        </div>
      </div>

      <!-- ================= 每月總結分頁內容 ================= -->
      <template v-if="currentMainTab === 'summary'">
        <div v-if="sortedSummaryYears.length === 0" class="flex-1 flex flex-col items-center justify-center text-slate-400 py-12 border-2 border-dashed border-ocean-200 rounded-3xl my-auto">
          <i data-lucide="calendar" class="w-12 h-12 mb-2 stroke-1 text-ocean-300"></i>
          <p class="text-sm">目前沒有總結月份，點擊右上方「+ 新增月份」</p>
        </div>

        <div v-else class="flex flex-col gap-5">
          <div v-for="yearData in summaryData" :key="yearData.year" class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-sm border border-ocean-100 overflow-hidden">
            
            <div class="bg-ocean-100/60 px-4 py-2.5 flex justify-between items-center border-b border-ocean-200/50">
              <span class="font-bold text-ocean-900 text-base">{{ yearData.year }} 年</span>
              <div class="text-xs font-semibold text-ocean-700 flex gap-3">
                <span>合計淨利：<strong class="text-emerald-600 text-sm">$ {{ calculateYearlyNetTotal(yearData).toLocaleString() }}</strong></span>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-center text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 border-b border-slate-200 font-bold">
                    <th class="py-2 border-r border-slate-200 w-16">月份</th>
                    <th class="py-2 border-r border-slate-200">應收</th>
                    <th class="py-2 border-r border-slate-200">應付</th>
                    <th class="py-2 border-r border-slate-200">淨利</th>
                    <th class="py-2">備註</th>
                    <th class="w-6"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  <tr v-for="(m, mIdx) in yearData.months" :key="m.month" class="hover:bg-slate-50/50">
                    <td class="py-2.5 font-bold border-r border-slate-200 text-slate-700">{{ m.month }}月</td>
                    <td class="py-2.5 border-r border-slate-200 text-ocean-700 font-semibold">$ {{ getMonthlyTotals(yearData.year, m.month).receivable.toLocaleString() }}</td>
                    <td class="py-2.5 border-r border-slate-200 text-amber-600 font-semibold">$ {{ getMonthlyTotals(yearData.year, m.month).payable.toLocaleString() }}</td>
                    <td class="py-2.5 border-r border-slate-200 font-bold text-emerald-600">$ {{ getMonthlyTotals(yearData.year, m.month).net.toLocaleString() }}</td>
                    <td class="py-2.5 px-1">
                      <input v-model="m.note" @change="saveData" type="text" placeholder="備註..." class="w-full text-center bg-transparent focus:outline-none text-[11px] text-slate-500" />
                    </td>
                    <td class="py-2.5 text-center">
                      <button @click="removeSummaryMonth(yearData, mIdx)" class="text-slate-300 hover:text-red-400 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </template>

      <!-- ================= 一般單項分頁內容 (潛團/上課/Fun Dive/散客) ================= -->
      <template v-else>
        <div v-if="currentTrips.length === 0" class="flex-1 flex flex-col items-center justify-center text-slate-400 py-12 border-2 border-dashed border-ocean-200 rounded-3xl my-auto">
          <i data-lucide="anchor" class="w-12 h-12 mb-2 stroke-1 text-ocean-300"></i>
          <p class="text-sm">目前沒有相關紀錄，點擊右上方新增</p>
        </div>

        <template v-else>
          <div class="mb-3">
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
              <button 
                v-for="trip in currentTrips" 
                :key="trip.id"
                @click="activeTripId = trip.id"
                :class="['px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all border flex items-center gap-1.5',
                         activeTripId === trip.id 
                          ? 'bg-ocean-700 text-white border-ocean-700 shadow-sm' 
                          : 'bg-white text-slate-600 border-slate-200 hover:border-ocean-300']"
              >
                <span>{{ trip.dateRange || '未定日期' }} {{ trip.title }}</span>
              </button>
            </div>
          </div>

          <div v-if="activeTrip" class="flex flex-col gap-4">
            
            <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-3 shadow-sm border border-ocean-100 flex items-center justify-between gap-2">
              <div class="flex items-center gap-1 bg-coral-100/80 px-2.5 py-1.5 rounded-full text-xs font-medium">
                <input 
                  type="date" 
                  v-model="activeTrip.startDate" 
                  @change="updateTripDateRange"
                  class="bg-transparent focus:outline-none w-24 text-center text-coral-400 font-bold cursor-pointer text-[11px]"
                />
                <span class="text-coral-400 font-normal px-0.5">-</span>
                <input 
                  type="date" 
                  v-model="activeTrip.endDate" 
                  @change="updateTripDateRange"
                  class="bg-transparent focus:outline-none w-24 text-center text-coral-400 font-bold cursor-pointer text-[11px]"
                />
              </div>

              <div class="flex items-center gap-1.5 flex-shrink-0">
                <input 
                  v-model="activeTrip.title" 
                  @change="saveData"
                  type="text" 
                  class="font-bold text-slate-700 bg-transparent border-b border-slate-300 hover:border-slate-400 focus:border-ocean-500 focus:outline-none px-1 text-xs w-24 text-left"
                  placeholder="名稱..."
                />
                <button @click="deleteTrip(activeTrip.id)" class="text-slate-300 hover:text-red-400 p-1" title="刪除整筆項目">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- 應收款項與訂金子表單區 -->
            <div v-for="sheet in activeReceivableSheets" :key="sheet.id" class="bg-white/90 backdrop-blur-sm rounded-3xl p-4 shadow-sm border border-ocean-100">
              <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-ocean-500"></span>
                  <input 
                    v-model="sheet.name" 
                    @change="saveData"
                    type="text" 
                    class="font-bold text-slate-800 bg-transparent focus:outline-none text-sm"
                  />
                </div>
                <button @click="deleteSheetBySheet(sheet)" class="text-slate-300 hover:text-red-400 p-1" title="刪除此表單">
                  <i data-lucide="x-circle" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- 標準數量/單價表格 -->
              <div v-if="sheet.type === 'receivable'" class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-100">
                      <th class="py-1.5 px-1 font-medium">品項</th>
                      <th class="py-1.5 px-1 font-medium w-16 text-center">{{ sheet.qtyLabel || '數量' }}</th>
                      <th class="py-1.5 px-1 font-medium w-16 text-right">單價</th>
                      <th class="py-1.5 px-1 font-medium w-16 text-right">合計</th>
                      <th class="py-1.5 px-1 font-medium">備註</th>
                      <th class="w-6"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                      <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                      <td class="py-1.5 px-1"><input v-model.number="row.count" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" /></td>
                      <td class="py-1.5 px-1"><input v-model.number="row.price" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none" /></td>
                      <td class="py-1.5 px-1 text-right font-semibold text-ocean-700">{{ ((row.count || 0) * (row.price || 0)) }}</td>
                      <td class="py-1.5 px-1"><input v-model="row.note" @change="saveData" class="w-full bg-transparent text-slate-400 focus:outline-none text-[11px]" placeholder="備註" /></td>
                      <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                    </tr>
                  </tbody>
                </table>
                
                <div class="flex justify-between items-center mt-2">
                  <button @click="addRow(sheet)" class="text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增品項
                  </button>
                  <label v-if="sheet.hasCheckbox" class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer font-medium">
                    <input type="checkbox" v-model="sheet.checkboxVal" @change="saveData" class="rounded text-ocean-500 focus:ring-ocean-500 w-4 h-4" />
                    <span>{{ sheet.checkboxLabel }}</span>
                  </label>
                </div>
              </div>

              <!-- 全團保險表格 (特殊多欄位) -->
              <div v-else-if="sheet.type === 'insurance'" class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-100">
                      <th class="py-1.5 px-1 font-medium">日期區間</th>
                      <th class="py-1.5 px-1 font-medium w-10 text-center">天數</th>
                      <th class="py-1.5 px-1 font-medium w-10 text-center">人數</th>
                      <th class="py-1.5 px-1 font-medium w-12 text-right">單價</th>
                      <th class="py-1.5 px-1 font-medium w-12 text-right">合計</th>
                      <th class="w-6"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                      <td class="py-1.5 px-1 flex items-center gap-0.5">
                        <input type="date" v-model="row.startDate" @change="saveData" class="w-16 bg-slate-50 text-[10px] rounded p-0.5" />
                        <span>-</span>
                        <input type="date" v-model="row.endDate" @change="saveData" class="w-16 bg-slate-50 text-[10px] rounded p-0.5" />
                      </td>
                      <td class="py-1.5 px-1"><input v-model.number="row.days" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" /></td>
                      <td class="py-1.5 px-1"><input v-model.number="row.people" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" /></td>
                      <td class="py-1.5 px-1"><input v-model.number="row.price" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none" /></td>
                      <td class="py-1.5 px-1 text-right font-semibold text-ocean-700">{{ ((row.days || 0) * (row.people || 0) * (row.price || 0)) }}</td>
                      <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                    </tr>
                  </tbody>
                </table>
                <button @click="addRow(sheet)" class="mt-2 text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                  <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增保險明細
                </button>
              </div>

              <!-- 應收訂金表格 -->
              <div v-else-if="sheet.type === 'deposit'">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-100">
                      <th class="py-1.5 px-1 font-medium">品項</th>
                      <th class="py-1.5 px-1 font-medium w-24 text-right">合計</th>
                      <th class="py-1.5 px-1 font-medium">備註</th>
                      <th class="w-6"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                      <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                      <td class="py-1.5 px-1"><input v-model.number="row.total" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none font-semibold text-ocean-700" /></td>
                      <td class="py-1.5 px-1"><input v-model="row.note" @change="saveData" class="w-full bg-transparent text-slate-400 focus:outline-none text-[11px]" placeholder="備註" /></td>
                      <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                    </tr>
                  </tbody>
                </table>
                <button @click="addRow(sheet)" class="mt-2 text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                  <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增訂金項目
                </button>
              </div>

              <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                <span class="text-slate-400 font-medium">{{ sheet.name }} 小計</span>
                <span class="font-bold text-ocean-900">$ {{ calculateSheetTotal(sheet).toLocaleString() }}</span>
              </div>
            </div>

            <!-- 總結算卡片 (應收) -->
            <div class="bg-gradient-to-br from-ocean-700 to-ocean-900 text-white rounded-3xl p-5 shadow-lg border border-ocean-500">
              <h3 class="text-sm font-bold border-b border-ocean-500/50 pb-2 mb-3">
                {{ currentTabInfo.name }}總結算金額 (應收)
              </h3>
              
              <div class="space-y-1.5 text-xs opacity-90 mb-3">
                <div class="flex justify-between">
                  <span>應收總額：</span>
                  <span>$ {{ getGrossReceivableTotal(activeTrip).toLocaleString() }}</span>
                </div>
                <div class="flex justify-between text-coral-100">
                  <span>應收訂金：</span>
                  <span>- $ {{ getReceivableDepositTotal(activeTrip).toLocaleString() }}</span>
                </div>
              </div>

              <div class="pt-2 border-t border-ocean-500/50 flex justify-between items-center">
                <span class="font-bold text-sm">應收最終總額</span>
                <span class="text-2xl font-black text-sand">$ {{ calculateTripReceivableTotal(activeTrip).toLocaleString() }}</span>
              </div>
            </div>

            <!-- 應付款項區域 (包含應付訂金 + 應付款項) -->
            <div v-for="sheet in activePayableSheets" :key="sheet.id" class="bg-white/90 backdrop-blur-sm rounded-3xl p-4 shadow-sm border border-amber-200/60">
              <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                  <input 
                    v-model="sheet.name" 
                    @change="saveData"
                    type="text" 
                    class="font-bold text-slate-800 bg-transparent focus:outline-none text-sm"
                  />
                </div>
                <button @click="deleteSheetBySheet(sheet)" class="text-slate-300 hover:text-red-400 p-1" title="刪除此表單">
                  <i data-lucide="x-circle" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- 應付訂金表格結構 -->
              <div v-if="sheet.type === 'payable_deposit'">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-100">
                      <th class="py-1.5 px-1 font-medium">品項</th>
                      <th class="py-1.5 px-1 font-medium w-24 text-right">合計</th>
                      <th class="py-1.5 px-1 font-medium">備註</th>
                      <th class="w-6"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                      <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                      <td class="py-1.5 px-1"><input v-model.number="row.total" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none font-semibold text-red-500" /></td>

            return sheet.rows.reduce((sum, r) => sum + ((r.days || 0) * (r.people || 0) * (r.price || 0)), 0);
          } else {
            return sheet.rows.reduce((sum, r) => sum + ((r.count || 0) * (r.price || 0)), 0);
          }
        };

        // 取得「原始應收總額」（不含訂金）
        const getGrossReceivableTotal = (trip) => {
          if (!trip || !trip.sheets) return 0;
          return trip.sheets
            .filter(s => s.type !== 'payable' && s.type !== 'payable_deposit' && s.type !== 'deposit')
            .reduce((sum, s) => sum + calculateSheetTotal(s), 0);
        };

        // 取得「應收訂金」總額
        const getReceivableDepositTotal = (trip) => {
          if (!trip || !trip.sheets) return 0;
          return trip.sheets
            .filter(s => s.type === 'deposit')
            .reduce((sum, s) => sum + calculateSheetTotal(s), 0);
        };

        // 取得「應付訂金」總額
        const getPayableDepositTotal = (trip) => {
          if (!trip || !trip.sheets) return 0;
          return trip.sheets
            .filter(s => s.type === 'payable_deposit')
            .reduce((sum, s) => sum + calculateSheetTotal(s), 0);
        };

        // 取得「一般應付款項」總額
        const getGeneralPayableTotal = (trip) => {
          if (!trip || !trip.sheets) return 0;
          return trip.sheets
            .filter(s => s.type === 'payable')
            .reduce((sum, s) => sum + calculateSheetTotal(s), 0);
        };

        // 應收最終總額 = 應收總額 - 應收訂金
        const calculateTripReceivableTotal = (trip) => {
          return getGrossReceivableTotal(trip) - getReceivableDepositTotal(trip);
        };

        // 最終淨利 = 應收總額 - 應付訂金 - 應付款項
        const calculateTripFinalNetTotal = (trip) => {
          return getGrossReceivableTotal(trip) - getPayableDepositTotal(trip) - getGeneralPayableTotal(trip);
        };

        // 每月總結的應收計算改為各單項的「應收總額」加總
        const getMonthlyTotals = (year, month) => {
          let receivable = 0, payable = 0;
          ['group', 'class', 'fundive', 'try'].forEach(cat => {
            (tripsData.value[cat] || []).forEach(trip => {
              if (trip.startDate) {
                const d = new Date(trip.startDate);
                if (!isNaN(d.getTime()) && d.getFullYear() === year && (d.getMonth() + 1) === month) {
                  receivable += getGrossReceivableTotal(trip);
                  payable += (getPayableDepositTotal(trip) + getGeneralPayableTotal(trip));
                }
              }
            });
          });
          return { receivable, payable, net: receivable - payable };
        };

        const calculateYearlyNetTotal = (yearData) => {
          if (!yearData || !yearData.months) return 0;
          return yearData.months.reduce((sum, m) => sum + getMonthlyTotals(yearData.year, m.month).net, 0);
        };

        const confirmAddMonth = () => {
          const year = parseInt(newMonthYear.value);
          const month = parseInt(newMonthValue.value);
          if (!year || !month) return;

          let yearObj = tripsData.value.summary.find(y => y.year === year);
          if (!yearObj) {
            yearObj = { year, months: [] };
            tripsData.value.summary.push(yearObj);
            tripsData.value.summary.sort((a, b) => b.year - a.year);
          }

          if (!yearObj.months.some(m => m.month === month)) {
            yearObj.months.push({ month, note: '' });
            yearObj.months.sort((a, b) => b.month - a.month);
          }

          saveData();
          showAddMonthModal = false;
          refreshIcons();
        };

        const removeSummaryMonth = (yearData, index) => {
          yearData.months.splice(index, 1);
          if (yearData.months.length === 0) {
            tripsData.value.summary = tripsData.value.summary.filter(y => y.year !== yearData.year);
          }
          saveData();
        };

        return {
          mainTabs, currentMainTab, activeTripId, tripsData, currentTrips, summaryData, sortedSummaryYears,
          currentTabInfo, activeTrip, activeReceivableSheets, activePayableSheets, showAddMonthModal,
          newMonthYear, newMonthValue, saveData, exportData, importData, updateTripDateRange, createNewTripGroup,
          deleteTrip, deleteSheetBySheet, addRow, removeRow, calculateSheetTotal, getGrossReceivableTotal,
          getReceivableDepositTotal, getPayableDepositTotal, getGeneralPayableTotal, calculateTripReceivableTotal,
          calculateTripFinalNetTotal, getMonthlyTotals, calculateYearlyNetTotal, confirmAddMonth, removeSummaryMonth
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
