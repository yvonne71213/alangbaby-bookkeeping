<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ocean Accounting App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              50: '#f0f7f9',
              100: '#e1eff3',
              200: '#b8dbe5',
              300: '#8ec7d7',
              500: '#489fb5',
              700: '#16697a',
              900: '#003049'
            },
            coral: {
              100: '#fde8e5',
              400: '#e07a5f'
            },
            sand: '#f4a261'
          }
        }
      }
    }
  </script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { background-color: #f7fafc; user-select: none; }
  </style>
</head>
<body class="flex justify-center bg-slate-100 min-h-screen">

  <div id="app" class="w-full max-w-md bg-ocean-50 min-h-screen flex flex-col shadow-2xl relative overflow-hidden text-slate-700">
    
    <!-- 背景裝飾 -->
    <div class="absolute top-12 right-4 opacity-20 pointer-events-none">
      <i data-lucide="fish" class="w-16 h-16 text-ocean-700"></i>
    </div>
    <div class="absolute bottom-12 left-2 opacity-15 pointer-events-none">
      <i data-lucide="waves" class="w-24 h-24 text-ocean-500"></i>
    </div>

    <!-- 頂部頁首：主分頁選單 -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-ocean-100 px-4 py-3 shadow-sm rounded-b-2xl">
      <div class="flex justify-around items-center">
        <button 
          v-for="tab in mainTabs" 
          :key="tab.id"
          @click="currentMainTab = tab.id"
          :class="['flex flex-col items-center p-2 rounded-xl transition-all duration-200', 
                   currentMainTab === tab.id ? 'bg-ocean-500 text-white shadow-md scale-105' : 'text-slate-400 hover:text-ocean-500']"
        >
          <i :data-lucide="tab.icon" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1 font-medium">{{ tab.name }}</span>
        </button>
      </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col p-4 overflow-y-auto z-10 pb-16">
      
      <!-- 當前分頁標題與新增按鈕 -->
      <div class="flex justify-between items-center mb-3">
        <h1 class="text-lg font-bold text-ocean-900 flex items-center gap-2">
          <i :data-lucide="currentTabInfo.icon" class="w-5 h-5 text-ocean-500"></i>
          {{ currentTabInfo.name }}
        </h1>
        <button 
          @click="createNewTripGroup"
          class="flex items-center gap-1 text-xs bg-ocean-500 hover:bg-ocean-700 text-white px-3 py-1.5 rounded-full shadow transition-all active:scale-95 font-medium"
        >
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>+ 新增潛團</span>
        </button>
      </div>

      <!-- 若無行程時的提示 -->
      <div v-if="currentTrips.length === 0" class="flex-1 flex flex-col items-center justify-center text-slate-400 py-12 border-2 border-dashed border-ocean-200 rounded-3xl my-auto">
        <i data-lucide="anchor" class="w-12 h-12 mb-2 stroke-1 text-ocean-300"></i>
        <p class="text-sm">目前沒有潛團行程，點擊右上方新增</p>
      </div>

      <template v-else>
        <!-- 行程切換標籤區 -->
        <div class="mb-3">
          <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
            <button 
              v-for="trip in currentTrips" 
              :key="trip.id"
              @click="activeTripId = trip.id"
              :class="['px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all border flex items-center gap-1.5',
                       activeTripId === trip.id 
                        ? 'bg-ocean-700 text-white border-ocean-700 shadow-sm' 
                        : 'bg-white text-slate-600 border-slate-200 hover:border-ocean-300']"
            >
              <span>{{ trip.dateRange }} {{ trip.title }}</span>
            </button>
          </div>
        </div>

        <!-- 當前選中的行程組合區 -->
        <div v-if="activeTrip" class="flex flex-col gap-4">
          
          <!-- 行程標頭與日期選擇 -->
          <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-3 shadow-sm border border-ocean-100 flex items-center justify-between">
            <div class="flex items-center gap-2 flex-1">
              <div class="flex items-center gap-1 bg-coral-100 text-coral-400 px-2 py-1 rounded-lg text-xs font-bold">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <input 
                  type="date" 
                  v-model="activeTrip.startDate" 
                  @change="updateTripDateRange"
                  class="bg-transparent focus:outline-none w-20 text-center"
                />
                <span class="text-slate-400 font-normal">-</span>
                <input 
                  type="date" 
                  v-model="activeTrip.endDate" 
                  @change="updateTripDateRange"
                  class="bg-transparent focus:outline-none w-20 text-center"
                />
              </div>
              <input 
                v-model="activeTrip.title" 
                @change="saveData"
                type="text" 
                class="font-bold text-slate-700 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-ocean-500 focus:outline-none px-1 text-sm flex-1"
                placeholder="潛團名稱..."
              />
            </div>
            <button @click="deleteTrip(activeTrip.id)" class="text-slate-300 hover:text-red-400 p-1" title="刪除整個潛團">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- 應收款項與訂金子表單區 -->
          <div v-for="sheet in activeReceivableSheets" :key="sheet.id" class="bg-white/90 backdrop-blur-sm rounded-3xl p-4 shadow-sm border border-ocean-100">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-ocean-500"></span>
                <input 
                  v-model="sheet.name" 
                  @change="saveData"
                  type="text" 
                  class="font-bold text-slate-800 bg-transparent focus:outline-none text-sm"
                />
              </div>
              <button @click="deleteSheetBySheet(sheet)" class="text-slate-300 hover:text-red-400 p-1" title="刪除此表單">
                <i data-lucide="x-circle" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- FUN DIVE / 自訂表單 -->
            <div v-if="sheet.type === 'fundive' || sheet.type === 'custom'" class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-100">
                    <th class="py-1.5 px-1 font-medium">品項</th>
                    <th class="py-1.5 px-1 font-medium w-12 text-center">數量</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-right">單價</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-right">合計</th>
                    <th class="py-1.5 px-1 font-medium">備註</th>
                    <th class="w-6"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                  <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                    <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.count" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.price" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1 text-right font-semibold text-ocean-700">{{ (row.count * row.price) || 0 }}</td>
                    <td class="py-1.5 px-1"><input v-model="row.note" @change="saveData" class="w-full bg-transparent text-slate-400 focus:outline-none text-[11px]" placeholder="備註" /></td>
                    <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                  </tr>
                </tbody>
              </table>
              <button @click="addRow(sheet)" class="mt-2 text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增品項
              </button>
            </div>

            <!-- 上課表單 -->
            <div v-else-if="sheet.type === 'class'">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-100">
                    <th class="py-1.5 px-1 font-medium">品項</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-center">數量/人天</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-right">單價</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-right">合計</th>
                    <th class="py-1.5 px-1 font-medium">備註</th>
                    <th class="w-6"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                  <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                    <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                    <td class="py-1.5 px-1"><input v-model="row.countText" @change="saveData" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" placeholder="2人3天" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.price" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1 text-right font-semibold text-ocean-700">{{ calculateClassRowTotal(row) }}</td>
                    <td class="py-1.5 px-1"><input v-model="row.note" @change="saveData" class="w-full bg-transparent text-slate-400 focus:outline-none text-[11px]" placeholder="備註" /></td>
                    <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                  </tr>
                </tbody>
              </table>

              <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
                  <input type="checkbox" v-model="sheet.textbookPaid" @change="saveData" class="w-4 h-4 rounded text-ocean-500 focus:ring-ocean-300" />
                  <span>教材已付</span>
                </label>
                <button @click="addRow(sheet)" class="text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                  <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增品項
                </button>
              </div>
            </div>

            <!-- 全團保險 -->
            <div v-else-if="sheet.type === 'insurance'">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-100">
                    <th class="py-1.5 px-1 font-medium">日期區間</th>
                    <th class="py-1.5 px-1 font-medium w-10 text-center">天數</th>
                    <th class="py-1.5 px-1 font-medium w-10 text-center">人數</th>
                    <th class="py-1.5 px-1 font-medium w-14 text-right">單價</th>
                    <th class="py-1.5 px-1 font-medium w-14 text-right">合計</th>
                    <th class="w-6"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                  <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                    <td class="py-1.5 px-1 flex items-center gap-0.5">
                      <input type="date" v-model="row.startDate" @change="onInsuranceDateChange(row)" class="w-[72px] bg-slate-50 text-[10px] rounded p-0.5" />
                      <span class="text-slate-400 text-[10px]">-</span>
                      <input type="date" v-model="row.endDate" @change="onInsuranceDateChange(row)" class="w-[72px] bg-slate-50 text-[10px] rounded p-0.5" />
                    </td>
                    <td class="py-1.5 px-1 text-center font-bold text-ocean-700">{{ row.days || 1 }}</td>
                    <td class="py-1.5 px-1"><input v-model.number="row.people" @change="saveData" type="number" min="1" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.price" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1 text-right font-semibold text-ocean-700">{{ (row.days * row.people * row.price) || 0 }}</td>
                    <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                  </tr>
                </tbody>
              </table>
              <button @click="addInsuranceRow(sheet)" class="mt-2 text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增保險明細
              </button>
            </div>

            <!-- 訂金 -->
            <div v-else-if="sheet.type === 'deposit'">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-100">
                    <th class="py-1.5 px-1 font-medium">品項</th>
                    <th class="py-1.5 px-1 font-medium w-24 text-right">合計 (扣抵)</th>
                    <th class="py-1.5 px-1 font-medium">備註</th>
                    <th class="w-6"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                  <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                    <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.total" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none font-semibold text-red-500" /></td>
                    <td class="py-1.5 px-1"><input v-model="row.note" @change="saveData" class="w-full bg-transparent text-slate-400 focus:outline-none text-[11px]" placeholder="備註" /></td>
                    <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                  </tr>
                </tbody>
              </table>
              <button @click="addRow(sheet)" class="mt-2 text-xs text-ocean-500 hover:text-ocean-700 flex items-center gap-1 font-medium">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增訂金項目
              </button>
            </div>

            <!-- 單一表單小計 -->
            <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
              <span class="text-slate-400 font-medium">{{ sheet.name }} 小計</span>
              <span class="font-bold text-ocean-900">$ {{ calculateSheetTotal(sheet).toLocaleString() }}</span>
            </div>

          </div>

          <!-- 潛團總結算卡片（應收總額） -->
          <div class="bg-gradient-to-br from-ocean-700 to-ocean-900 text-white rounded-3xl p-5 shadow-lg border border-ocean-500">
            <h3 class="text-sm font-bold border-b border-ocean-500/50 pb-2 mb-3">
              潛團總結算金額 (應收)
            </h3>
            
            <div class="space-y-1.5 text-xs opacity-90 mb-3">
              <div v-for="s in activeReceivableSheets" :key="s.id" class="flex justify-between">
                <span>{{ s.name }}：</span>
                <span :class="s.type === 'deposit' ? 'text-coral-100' : ''">
                  {{ s.type === 'deposit' ? '-' : '+' }} $ {{ calculateSheetTotal(s).toLocaleString() }}
                </span>
              </div>
            </div>

            <div class="pt-2 border-t border-ocean-500/50 flex justify-between items-center">
              <span class="font-bold text-sm">應收最終總額</span>
              <span class="text-2xl font-black text-sand">$ {{ calculateTripReceivableTotal(activeTrip).toLocaleString() }}</span>
            </div>
          </div>

          <!-- 應付款項表格 -->
          <div v-for="sheet in activePayableSheets" :key="sheet.id" class="bg-white/90 backdrop-blur-sm rounded-3xl p-4 shadow-sm border border-amber-200/60">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <input 
                  v-model="sheet.name" 
                  @change="saveData"
                  type="text" 
                  class="font-bold text-slate-800 bg-transparent focus:outline-none text-sm"
                />
              </div>
              <button @click="deleteSheetBySheet(sheet)" class="text-slate-300 hover:text-red-400 p-1" title="刪除此表單">
                <i data-lucide="x-circle" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-100">
                    <th class="py-1.5 px-1 font-medium">品項</th>
                    <th class="py-1.5 px-1 font-medium w-12 text-center">數量</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-right">單價</th>
                    <th class="py-1.5 px-1 font-medium w-16 text-right">合計</th>
                    <th class="py-1.5 px-1 font-medium">備註</th>
                    <th class="w-6"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                  <tr v-for="(row, rIndex) in sheet.rows" :key="rIndex">
                    <td class="py-1.5 px-1"><input v-model="row.name" @change="saveData" class="w-full bg-transparent focus:outline-none font-medium" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.count" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-center rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1"><input v-model.number="row.price" @change="saveData" type="number" min="0" class="w-full bg-slate-50 text-right rounded py-0.5 focus:outline-none" /></td>
                    <td class="py-1.5 px-1 text-right font-semibold text-amber-600">{{ (row.count * row.price) || 0 }}</td>
                    <td class="py-1.5 px-1"><input v-model="row.note" @change="saveData" class="w-full bg-transparent text-slate-400 focus:outline-none text-[11px]" placeholder="備註" /></td>
                    <td class="py-1.5 px-1 text-center"><button @click="removeRow(sheet, rIndex)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></td>
                  </tr>
                </tbody>
              </table>
              <button @click="addRow(sheet)" class="mt-2 text-xs text-amber-600 hover:text-amber-700 flex items-center gap-1 font-medium">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增應付品項
              </button>
            </div>

            <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
              <span class="text-slate-400 font-medium">{{ sheet.name }} 總額</span>
              <span class="font-bold text-amber-600">$ {{ calculateSheetTotal(sheet).toLocaleString() }}</span>
            </div>
          </div>

          <!-- 最終淨額卡片 -->
          <div class="bg-slate-800 text-white rounded-3xl p-5 shadow-xl border border-slate-700">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">最終收支淨額 (應收總額 - 應付總額)</h3>
            <div class="space-y-1.5 text-xs text-slate-300 mb-3">
              <div class="flex justify-between">
                <span>1. 應收最終總額：</span>
                <span class="font-semibold text-white">$ {{ calculateTripReceivableTotal(activeTrip).toLocaleString() }}</span>
              </div>
              <div class="flex justify-between text-amber-300">
                <span>2. 應付款項總額：</span>
                <span class="font-semibold">- $ {{ getPayableTotal(activeTrip).toLocaleString() }}</span>
              </div>
            </div>
            <div class="pt-2 border-t border-slate-700 flex justify-between items-center">
              <span class="font-bold text-sm">最終淨利</span>
              <span class="text-2xl font-black text-emerald-400">$ {{ calculateTripFinalNetTotal(activeTrip).toLocaleString() }}</span>
            </div>
          </div>

        </div>
      </template>
    </main>

  </div>

  <script>
    const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

    // 取得當前日期的輔助函式 (格式 YYYY-MM-DD)
    const getTodayISOString = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    createApp({
      setup() {
        const mainTabs = [
          { id: 'group', name: '潛團', icon: 'users' },
          { id: 'class', name: '上課', icon: 'graduation-cap' },
          { id: 'fundive', name: 'Fun Dive', icon: 'compass' },
          { id: 'try', name: '體驗', icon: 'sparkles' },
          { id: 'summary', name: '每月總結', icon: 'pie-chart' }
        ];

        const currentMainTab = ref('group');
        const activeTripId = ref(null);

        // 預設 FUN DIVE 項目
        const defaultFunDiveRows = [
          { name: '三人房 (假日)', count: 0, price: 2500, note: '' },
          { name: '四人房 (假日)', count: 0, price: 3100, note: '' },
          { name: '六人房 (假日)', count: 0, price: 4000, note: '' },
          { name: '機車', count: 0, price: 300, note: '' },
          { name: '船潛', count: 0, price: 1750, note: '' },
          { name: '岸潛導潛', count: 0, price: 1350, note: '' },
          { name: '空氣氣瓶', count: 0, price: 200, note: '' },
          { name: '船票', count: 0, price: 950, note: '' },
          { name: '船潛高氧補差額', count: 0, price: 200, note: '' },
          { name: 'BCD', count: 0, price: 300, note: '' },
          { name: '調節器', count: 0, price: 300, note: '' },
          { name: '輕裝 (套鞋 防寒衣 蛙鞋)', count: 0, price: 50, note: '' },
          { name: '便當', count: 0, price: 130, note: '' }
        ];

        // 預設應付款項項目
        const defaultPayableRows = [
          { name: '教練費', count: 0, price: 5000, note: '' },
          { name: '船費', count: 0, price: 1000, note: '' }
        ];

        // 預設預載範例資料 (使用當日日期)
        const todayStr = getTodayISOString();
        const todayObj = new Date();
        const defaultDateRange = `${todayObj.getMonth() + 1}/${todayObj.getDate()}-${todayObj.getMonth() + 1}/${todayObj.getDate()}`;

        const defaultTripsData = {
          group: [
            {
              id: 'trip_1',
              title: '潛團名稱',
              startDate: todayStr,
              endDate: todayStr,
              dateRange: defaultDateRange,
              sheets: [
                { id: 's1', name: 'FUN DIVE應收款項', type: 'fundive', rows: defaultFunDiveRows },
                {
                  id: 's2',
                  name: '上課應收款項',
                  type: 'class',
                  textbookPaid: true,
                  rows: [
                    { name: '教練費', countText: '0', price: 5000, note: '' },
                    { name: '氣瓶', countText: '0', price: 200, note: '' },
                    { name: '裝備', countText: '0人0天', price: 800, note: '' }
                  ]
                },
                {
                  id: 's3',
                  name: '全團保險',
                  type: 'insurance',
                  rows: [
                    { startDate: todayStr, endDate: todayStr, days: 0, people: 0, price: 50 }
                  ]
                },
                {
                  id: 's4',
                  name: '訂金',
                  type: 'deposit',
                  rows: [
                    { name: '住宿', total: 4000, note: '' },
                    { name: '船費', total: 4000, note: '' }
                  ]
                },
                {
                  id: 's5',
                  name: '應付款項',
                  type: 'payable',
                  rows: defaultPayableRows
                }
              ]
            }
          ],
          class: [],
          fundive: [],
          try: [],
          summary: []
        };

        const tripsData = ref(defaultTripsData);

        onMounted(() => {
          const savedData = localStorage.getItem('ocean_accounting_trips_data_v4');
          if (savedData) {
            try {
              tripsData.value = JSON.parse(savedData);
            } catch (e) {
              console.error('資料讀取失敗，使用預設值', e);
            }
          }
          if (currentTrips.value.length > 0) {
            activeTripId.value = currentTrips.value[0].id;
          }
          refreshIcons();
        });

        const saveData = () => {
          localStorage.setItem('ocean_accounting_trips_data_v4', JSON.stringify(tripsData.value));
        };

        const currentTrips = computed(() => {
          return tripsData.value[currentMainTab.value] || [];
        });

        const currentTabInfo = computed(() => {
          return mainTabs.find(t => t.id === currentMainTab.value) || mainTabs[0];
        });

        const activeTrip = computed(() => {
          return currentTrips.value.find(t => t.id === activeTripId.value) || currentTrips.value[0] || null;
        });

        const activeReceivableSheets = computed(() => {
          if (!activeTrip.value) return [];
          return activeTrip.value.sheets.filter(s => s.type !== 'payable');
        });

        const activePayableSheets = computed(() => {
          if (!activeTrip.value) return [];
          return activeTrip.value.sheets.filter(s => s.type === 'payable');
        });

        watch(currentMainTab, () => {
          if (currentTrips.value.length > 0) {
            activeTripId.value = currentTrips.value[0].id;
          } else {
            activeTripId.value = null;
          }
          refreshIcons();
        });

        watch(activeTripId, () => {
          refreshIcons();
        });

        const refreshIcons = () => {
          nextTick(() => {
            if (window.lucide) {
              lucide.createIcons();
            }
          });
        };

        // 更新日期顯示格式 (無年份 8/19-8/19)
        const updateTripDateRange = () => {
          if (!activeTrip.value) return;
          const s = new Date(activeTrip.value.startDate);
          const e = new Date(activeTrip.value.endDate);
          
          if (!isNaN(s.getTime())) {
            const sm = s.getMonth() + 1;
            const sd = s.getDate();
            if (!isNaN(e.getTime())) {
              const em = e.getMonth() + 1;
              const ed = e.getDate();
              activeTrip.value.dateRange = `${sm}/${sd}-${em}/${ed}`;
            } else {
              activeTrip.value.dateRange = `${sm}/${sd}-${sm}/${sd}`;
            }
          }
          saveData();
        };

        // 新增潛團（日期預設當日）
        const createNewTripGroup = () => {
          const todayISO = getTodayISOString();
          const today = new Date();
          const month = today.getMonth() + 1;
          const day = today.getDate();

          const newTrip = {
            id: 'trip_' + Date.now(),
            title: '新潛團行程',
            startDate: todayISO,
            endDate: todayISO,
            dateRange: `${month}/${day}-${month}/${day}`,
            sheets: [
              { id: 's_' + Date.now() + '_1', name: 'FUN DIVE應收款項', type: 'fundive', rows: JSON.parse(JSON.stringify(defaultFunDiveRows)) },
              { id: 's_' + Date.now() + '_2', name: '上課應收款項', type: 'class', textbookPaid: false, rows: [{ name: '教練費', countText: '1', price: 5000, note: '' }] },
              { id: 's_' + Date.now() + '_3', name: '全團保險', type: 'insurance', rows: [{ startDate: todayISO, endDate: todayISO, days: 1, people: 1, price: 50 }] },
              { id: 's_' + Date.now() + '_4', name: '訂金', type: 'deposit', rows: [{ name: '住宿訂金', total: 0, note: '' }] },
              { id: 's_' + Date.now() + '_5', name: '應付款項', type: 'payable', rows: JSON.parse(JSON.stringify(defaultPayableRows)) }
            ]
          };

          tripsData.value[currentMainTab.value].push(newTrip);
          activeTripId.value = newTrip.id;
          saveData();
          refreshIcons();
        };

        const deleteTrip = (tripId) => {
          if (confirm('確定要刪除整個潛團行程嗎？')) {
            tripsData.value[currentMainTab.value] = tripsData.value[currentMainTab.value].filter(t => t.id !== tripId);
            if (currentTrips.value.length > 0) {
              activeTripId.value = currentTrips.value[0].id;
            } else {
              activeTripId.value = null;
            }
            saveData();
          }
        };

        const deleteSheetBySheet = (sheetTarget) => {
          if (confirm('確定要刪除這個表單嗎？')) {
            activeTrip.value.sheets = activeTrip.value.sheets.filter(s => s.id !== sheetTarget.id);
            saveData();
          }
        };

        const onInsuranceDateChange = (row) => {
          if (row.startDate && row.endDate) {
            const start = new Date(row.startDate);
            const end = new Date(row.endDate);
            const diffTime = end.getTime() - start.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            row.days = diffDays > 0 ? diffDays : 1;
          } else {
            row.days = 1;
          }
          saveData();
        };

        const addRow = (sheet) => {
          sheet.rows.push({ name: '', count: 1, countText: '1', price: 0, total: 0, note: '' });
          saveData();
          refreshIcons();
        };

        // 新增保險明細（日期預設當日）
        const addInsuranceRow = (sheet) => {
          const todayISO = getTodayISOString();
          sheet.rows.push({ startDate: todayISO, endDate: todayISO, days: 0, people: 0, price: 50 });
          saveData();
          refreshIcons();
        };

        const removeRow = (sheet, index) => {
          sheet.rows.splice(index, 1);
          saveData();
        };

        const calculateClassRowTotal = (row) => {
          if (!row.price) return 0;
          const text = String(row.countText || '');
          const numbers = text.match(/\d+/g);
          if (numbers && numbers.length > 0) {
            const multiplier = numbers.reduce((acc, num) => acc * parseInt(num, 10), 1);
            return multiplier * row.price;
          }
          return row.price;
        };

        const calculateSheetTotal = (sheet) => {
          if (!sheet || !sheet.rows) return 0;
          if (sheet.type === 'deposit') {
            return sheet.rows.reduce((sum, r) => sum + (r.total || 0), 0);
          } else if (sheet.type === 'insurance') {
            return sheet.rows.reduce((sum, r) => sum + ((r.days || 1) * (r.people || 0) * (r.price || 0)), 0);
          } else if (sheet.type === 'class') {
            return sheet.rows.reduce((sum, r) => sum + calculateClassRowTotal(r), 0);
          } else {
            return sheet.rows.reduce((sum, r) => sum + ((r.count || 0) * (r.price || 0)), 0);
          }
        };

        const calculateTripReceivableTotal = (trip) => {
          if (!trip || !trip.sheets) return 0;
          let income = 0;
          let deposit = 0;

          trip.sheets.forEach(sheet => {
            const total = calculateSheetTotal(sheet);
            if (sheet.type === 'deposit') {
              deposit += total;
            } else if (sheet.type !== 'payable') {
              income += total;
            }
          });

          return income - deposit;
        };

        const getPayableTotal = (trip) => {
          if (!trip || !trip.sheets) return 0;
          let payable = 0;
          trip.sheets.forEach(sheet => {
            if (sheet.type === 'payable') {
              payable += calculateSheetTotal(sheet);
            }
          });
          return payable;
        };

        const calculateTripFinalNetTotal = (trip) => {
          return calculateTripReceivableTotal(trip) - getPayableTotal(trip);
        };

        return {
          mainTabs,
          currentMainTab,
          currentTabInfo,
          currentTrips,
          activeTripId,
          activeTrip,
          activeReceivableSheets,
          activePayableSheets,
          createNewTripGroup,
          deleteTrip,
          deleteSheetBySheet,
          updateTripDateRange,
          onInsuranceDateChange,
          addRow,
          addInsuranceRow,
          removeRow,
          calculateClassRowTotal,
          calculateSheetTotal,
          calculateTripReceivableTotal,
          getPayableTotal,
          calculateTripFinalNetTotal,
          saveData
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
